<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industry 4.0 & IIoT Interactive Practice Quiz</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --error: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--text-light);
            margin-top: 0;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }

        .config-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            background: #fff;
            color: var(--text);
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .hidden {
            display: none !important;
        }

        .question-meta {
            font-size: 0.875rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .question-image {
            margin-bottom: 20px;
            text-align: center;
        }

        .question-image svg {
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fff;
            padding: 10px;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
        }

        .option-item {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .option-item:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option-item input {
            margin-right: 12px;
        }

        .option-item.correct {
            background-color: #dcfce7;
            border-color: var(--success);
            color: #166534;
            font-weight: 600;
        }

        .option-item.incorrect {
            background-color: #fee2e2;
            border-color: var(--error);
            color: #991b1b;
        }

        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .progress-indicator {
            font-weight: 500;
            color: var(--text-light);
        }

        .explanation {
            background: #f1f5f9;
            border-left: 4px solid var(--primary);
            padding: 12px 16px;
            border-radius: 0 6px 6px 0;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .results-card {
            text-align: center;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Industry 4.0 & IIoT Practice Quiz</h1>
            <p class="subtitle">Interactive Quiz Platform (Weeks 0 to 12)</p>
        </header>

        <!-- Configuration Screen -->
        <div id="setup-card" class="card">
            <div class="config-group">
                <label for="mode-select">Select Quiz Mode:</label>
                <select id="mode-select" onchange="toggleModeOptions()">
                    <option value="week">Week Wise Quiz</option>
                    <option value="random">Randomized Quiz</option>
                </select>
            </div>

            <div id="week-config" class="config-group">
                <label for="week-select">Select Week:</label>
                <select id="week-select">
                    <option value="0">Week 0: Assignment 0</option>
                    <option value="1">Week 1: Assignment 1</option>
                    <option value="2">Week 2: Assignment 2</option>
                    <option value="3">Week 3: Assignment 3</option>
                    <option value="4">Week 4: Assignment 4</option>
                    <option value="5">Week 5: Assignment 5</option>
                    <option value="6">Week 6: Assignment 6</option>
                    <option value="7">Week 7: Assignment 7</option>
                    <option value="8">Week 8: Assignment 8</option>
                    <option value="9">Week 9: Assignment 9</option>
                    <option value="10">Week 10: Assignment 10</option>
                    <option value="11">Week 11: Assignment 11</option>
                    <option value="12">Week 12: Assignment 12</option>
                </select>
            </div>

            <div id="random-config" class="config-group hidden">
                <label for="count-select">Select Question Count:</label>
                <select id="count-select">
                    <option value="20">20 Questions</option>
                    <option value="40">40 Questions</option>
                    <option value="all">All Questions (195)</option>
                </select>
            </div>

            <button onclick="startQuiz()">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-card" class="card hidden">
            <div id="question-meta" class="question-meta">Week 0 • Question 1 of 15</div>
            <div id="question-text" class="question-text">Loading question...</div>
            <div id="question-image-container" class="question-image hidden"></div>
            
            <ul id="options-list" class="options-list">
                <!-- Options injected dynamically -->
            </ul>

            <div id="explanation-box" class="explanation hidden">
                <strong>Answer & Explanation:</strong> <span id="explanation-text"></span>
            </div>

            <div class="quiz-footer">
                <span id="progress-indicator" class="progress-indicator">Progress: 1/15</span>
                <button id="next-btn" onclick="handleNext()" style="width: auto;">Next Question</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-card" class="card results-card hidden">
            <h2>Quiz Completed!</h2>
            <p>Here is your performance summary:</p>
            <div id="score-display" class="score-display">0 / 0</div>
            <p id="feedback-msg" style="font-size: 1.1rem; margin-bottom: 25px;"></p>
            <button onclick="resetQuiz()" style="width: auto; margin: 0 auto;">Take Another Quiz</button>
        </div>
    </div>

    <script>
